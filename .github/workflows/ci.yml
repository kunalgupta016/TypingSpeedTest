name: CI
on:
  push:
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
        env:
          NEXT_PUBLIC_SITE_URL: https://fingerfox.example
          NEXT_PUBLIC_LEGAL_NAME: CI placeholder
          NEXT_PUBLIC_BUSINESS_ADDRESS: CI placeholder
          NEXT_PUBLIC_CONTACT_EMAIL: ci@example.com
          NEXT_PUBLIC_GRIEVANCE_CONTACT: ci@example.com
